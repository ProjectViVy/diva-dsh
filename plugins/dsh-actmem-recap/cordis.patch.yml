# cordis.patch.yml — bundle overlay for dsh-actmem-recap.
#
# Registers `/recap` and, when `auto` is on, schedules a bounded catch-up recap
# after `minCompletedTurns` turns once `delayMs` has passed since the last one.
# Recaps are generated on an isolated, tool-free model call over user-visible
# exchanges only, appended to $DSH_HOME/actmem-recap/recaps.jsonl, and written
# into the decaying ActMem card in dsh-local-memory over component IPC.
- insert:
    - id: actmem-recap
      name: dsh-actmem-recap
      config:
        enabled: true
        auto: true
        # deliver: store   # store | inject   (inject appends the recap to the next step's context)
        # card:            # decaying memory-card placement; enabled by default
        #   enabled: true
        #   scope: qq      # fixed: shared/bili scopes reach the Bilibili context and are refused
        #   importance: 45 # < 50 = forgettable after forgetAfterDays; 50-64 = slow fade
        #   tags: [recap]  # keep 'owner' out: it wins the 「初次相遇」 promotion
        #   maxChars: 600
        #   timeoutMs: 15000
